<!DOCTYPE html>

<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1, viewport-fit=cover" name="viewport"/>
<meta content="#102638" name="theme-color"/>
<meta content="Usinagem Fácil" name="application-name"/>
<meta content="yes" name="apple-mobile-web-app-capable"/>
<meta content="black-translucent" name="apple-mobile-web-app-status-bar-style"/>
<meta content="Usinagem Fácil" name="apple-mobile-web-app-title"/>
<link href="manifest.webmanifest" rel="manifest"/>
<link href="icons/apple-touch-icon.png" rel="apple-touch-icon"/>
<title>Usinagem Fácil — Início</title>
<link href="css/styles.css" rel="stylesheet"/>
</head>
<body>
<header class="topbar">
<div aria-label="Usinagem Fácil" class="brand">
<div class="brand-icon">⚙</div>
<div><strong>USINAGEM <span>FÁCIL</span></strong><small>Informação de usinagem na palma da mão</small></div>
</div>
<a aria-label="Abrir Mais / Tabelas" class="icon-button" href="tabelas.html">☰</a>
</header>
<main>
<section class="welcome">
<h1>O que você precisa?</h1>
<p>Escolha uma opção ou pesquise uma medida, rosca ou cálculo.</p>
<div class="search-box">
<span aria-hidden="true">⌕</span>
<input aria-label="Pesquisar no app" autocomplete="off" id="search" placeholder="Ex.: M10 x 1,5 • 1/2” • RPM" type="search"/>
<button aria-label="Limpar pesquisa" id="clearSearch" type="button">×</button>
</div>
<div aria-live="polite" class="search-feedback" id="searchFeedback"></div>
</section>
<section aria-labelledby="acoes-title" class="section">
<div class="section-heading"><h2 id="acoes-title">Escolha uma opção</h2><span>Toque para abrir</span></div>
<div class="action-grid" id="actionGrid">
<button class="action-card blue" data-href="roscas.html" data-keywords="rosca roscas metrica unc unf bsw bsp npt m10" type="button">
<span class="visual">🔩</span><span class="copy"><b>Roscas</b><small>Descubra a broca e o passo</small></span><span class="arrow">›</span>
</button>
<button class="action-card amber" data-href="furos.html" data-keywords="furo furos broca furacao" type="button">
<span class="visual">◉</span><span class="copy"><b>Furos</b><small>Brocas, diâmetros e furação</small></span><span class="arrow">›</span>
</button>
<button class="action-card green" data-href="fresamento.html" data-keywords="fresamento fresa rpm avanço avanco" type="button">
<span class="visual">⚙</span><span class="copy"><b>Fresamento</b><small>RPM, avanço e avanço por faca</small></span><span class="arrow">›</span>
</button>
<button class="action-card red" data-href="torneamento.html" data-keywords="torneamento torno rpm avanço avanco velocidade corte" type="button">
<span class="visual">↻</span><span class="copy"><b>Torneamento</b><small>RPM, avanço e velocidade de corte</small></span><span class="arrow">›</span>
</button>
<button class="action-card purple" data-href="conversoes.html" data-keywords="conversao conversões polegada milimetro mm" type="button">
<span class="visual fraction">½″</span><span class="copy"><b>Conversões</b><small>Polegada ↔ milímetro</small></span><span class="arrow">›</span>
</button>
<button class="action-card cyan" data-href="calculadoras.html" data-keywords="calculadora calculadoras calcular rpm avanço velocidade" type="button">
<span class="visual">🧮</span><span class="copy"><b>Calculadoras</b><small>Escolha o que quer descobrir</small></span><span class="arrow">›</span>
</button>
<button class="action-card yellow" data-href="tabelas.html" data-keywords="tabela tabelas consulta" type="button">
<span class="visual">▤</span><span class="copy"><b>Tabelas</b><small>Consulta técnica simplificada</small></span><span class="arrow">›</span>
</button>
<button class="action-card mint" data-href="aprender.html" data-keywords="aprender ajuda explicação rpm rosca avanço" type="button">
<span class="visual">💡</span><span class="copy"><b>Aprender</b><small>Explicações simples com imagens</small></span><span class="arrow">›</span>
</button>
</div>
</section>
<section class="help-card">
<div class="help-icon">?</div>
<div><b>Não sabe qual opção escolher?</b><p>Use a pesquisa acima. Você pode digitar algo como “M10”, “broca”, “RPM” ou “1/2”.</p></div>
</section>
</main>
<nav class="bottom-nav" aria-label="Navegação principal"></nav>
<script type="module" src="js/pages/index.js"></script><script type="module" src="js/common.js"></script>
</body>
</html>
